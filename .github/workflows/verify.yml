name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Vitest's timeouts run inside the workerd runner, so a frozen runner may never report
    # them. Cap the job well above its expected length, not GitHub's 6 h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          package-manager: true
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: pnpm exec wrangler types --check
      - run: vp test run
